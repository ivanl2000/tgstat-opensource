{% extends "base.html" %}
{% block title %}tgstat-opensource — Поиск{% endblock %}

{% block content %}
<h1 style="font-size: 24px; margin-bottom: 20px;">🔍 Поиск</h1>

<div class="search-form">
    <input type="text" id="searchInput" placeholder="Введите название или @username канала…"
           value="{{ query }}" onkeydown="if(event.key==='Enter'){doSearch()}"/>
    <button class="btn btn-primary" onclick="doSearch()">Найти</button>
</div>

{% if query %}
<div class="text-muted mb-16" style="font-size: 13px;">
    Результаты по запросу «<strong>{{ query }}</strong>»
</div>

<div id="searchResults">
    <div class="loading">Поиск…</div>
</div>
{% else %}
<div class="empty-state" id="searchEmpty">
    <div class="empty-state-icon">🔍</div>
    <div class="empty-state-text">Введите запрос для поиска по каналам</div>
</div>
{% endif %}
{% endblock %}

{% block scripts %}
<script>
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  window.location.href = '/search?q=' + encodeURIComponent(q);
}

async function loadResults() {
  const urlParams = new URLSearchParams(window.location.search);
  const q = urlParams.get('q');
  if (!q) return;

  const el = document.getElementById('searchResults');
  if (!el) return;

  const [channels, posts] = await Promise.all([
    api('/api/search?q=' + encodeURIComponent(q)),
    api('/api/search/posts?q=' + encodeURIComponent(q) + '&limit=10'),
  ]);

  let html = '';

  // Channels
  if (channels && channels.length) {
    html += '<h2 class="mb-16">📺 Каналы <span class="text-muted" style="font-size:13px;">(' + channels.length + ')</span></h2>';
    channels.forEach(ch => {
      html += `<div class="search-result-item" onclick="window.location='/channel/${Number(ch.id)}'">
        <div class="search-result-title">${escapeHtml(ch.title || ch.username || '')}</div>
        <div class="search-result-meta">
          @${escapeHtml(ch.username || '')} · 👥 ${fmtNum(ch.participants_count)} ·
          <span class="badge badge-category">${escapeHtml(ch.category || 'Разное')}</span>
        </div>
      </div>`;
    });
  }

  // Posts
  if (posts && posts.length) {
    html += '<h2 class="mb-16 mt-16">📝 Посты <span class="text-muted" style="font-size:13px;">(' + posts.length + ')</span></h2>';
    posts.forEach(p => {
      const text = escapeHtml(truncate(p.text, 120));
      html += `<div class="search-result-item" onclick="window.location='/channel/${Number(p.channel_id)}'">
        <div class="search-result-title">${text || '<span class="text-muted">[медиа]</span>'}</div>
        <div class="search-result-meta">
          @${escapeHtml(p.channel_username || '')} · 👁️ ${fmtNum(p.views)} · 📅 ${escapeHtml(fmtDate(p.date))}
        </div>
      </div>`;
    });
  }

  const noChannels = !channels || !channels.length;
  const noPosts = !posts || !posts.length;
  if (noChannels && noPosts) {
    html += '<div class="empty-state"><div class="empty-state-icon">😕</div><div class="empty-state-text">Ничего не найдено по запросу «' + escapeHtml(q) + '»</div></div>';
  }

  el.innerHTML = html;
}

{% if query %}
loadResults();
{% endif %}
</script>
{% endblock %}
